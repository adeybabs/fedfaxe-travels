###port information
spring.application.name=fedFaxe
server.port=8087

# Allow external connections
server.address=0.0.0.0

server.forward-headers-strategy=native

aws.region=us-east-1
aws.bucketName=fedfaxe-standard-bucket

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Paystack Test Keys
paystack.secret.key=place-holder
paystack.public.key=place-holder
paystack.base.url=https://api.paystack.co

# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8

rapidapi.key=place-holder
rapidapi.host=booking-com15.p.rapidapi.com


